<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VendorBridge - Purchase Orders</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }
        .sidebar {
            position: fixed; left: 0; top: 0;
            width: 240px; height: 100vh;
            background: linear-gradient(180deg, #667eea, #764ba2);
            color: white; padding: 20px 0; z-index: 100;
        }
        .sidebar-logo { padding: 0 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.2); margin-bottom: 20px; }
        .sidebar-logo h2 { font-size: 20px; font-weight: 800; }
        .sidebar-logo p { font-size: 11px; opacity: 0.7; }
        .nav-item {
            display: flex; align-items: center; gap: 12px;
            padding: 13px 20px; cursor: pointer;
            transition: background 0.3s; font-size: 14px;
            font-weight: 500; text-decoration: none; color: white;
        }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.2); }
        .nav-item span { font-size: 18px; }
        .main { margin-left: 240px; padding: 30px; min-height: 100vh; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .topbar h1 { font-size: 24px; color: #333; font-weight: 700; }
        .btn-invoice {
            padding: 6px 14px; background: #667eea;
            color: white; border: none; border-radius: 6px;
            font-size: 12px; cursor: pointer; font-weight: 600;
        }
        .btn-invoice:hover { opacity: 0.9; }
        .table-container {
            background: white; border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08); overflow: hidden;
        }
        .table-header { padding: 20px; border-bottom: 1px solid #f0f0f0; }
        .table-header h3 { font-size: 16px; color: #333; }
        table { width: 100%; border-collapse: collapse; }
        th {
            background: #f8f9fa; padding: 12px 16px;
            text-align: left; font-size: 13px;
            color: #666; font-weight: 600;
        }
        td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid #f5f5f5; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #fafafa; }
        .status-badge {
            padding: 4px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 600;
        }
        .status-pending { background: #fef3e2; color: #f39c12; }
        .status-invoiced { background: #e8fdf0; color: #2ed573; }
        .empty-state { text-align: center; padding: 50px; color: #888; }
        .po-number { font-family: monospace; font-weight: 700; color: #667eea; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-logo">
        <h2>🏢 VendorBridge</h2>
        <p>Procurement ERP</p>
    </div>
    <a href="/dashboard" class="nav-item"><span>📊</span> Dashboard</a>
    <a href="/vendors" class="nav-item"><span>🏭</span> Vendors</a>
    <a href="/rfq" class="nav-item"><span>📋</span> RFQs</a>
    <a href="/quotations" class="nav-item"><span>💬</span> Quotations</a>
    <a href="/orders" class="nav-item active"><span>📦</span> Purchase Orders</a>
    <a href="/invoices" class="nav-item"><span>🧾</span> Invoices</a>
    <a href="/logs" class="nav-item"><span>📜</span> Activity Logs</a>
    <a href="/reports" class="nav-item"><span>📈</span> Reports</a>
</div>

<div class="main">
    <div class="topbar">
        <h1>📦 Purchase Orders</h1>
    </div>

    <div class="table-container">
        <div class="table-header">
            <h3>All Purchase Orders</h3>
        </div>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>PO Number</th>
                    <th>Vendor</th>
                    <th>Amount (Rs.)</th>
                    <th>Status</th>
                    <th>Created At</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="ordersTable">
                <tr><td colspan="7" class="empty-state">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    async function loadOrders() {
        const res = await fetch('/api/orders');
        const orders = await res.json();
        const tbody = document.getElementById('ordersTable');

        if (orders.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="empty-state">📦 No purchase orders yet. Approve a quotation first!</td></tr>';
            return;
        }

        tbody.innerHTML = orders.map((o, i) => `
            <tr>
                <td>${i + 1}</td>
                <td><span class="po-number">${o.po_number}</span></td>
                <td>${o.vendor_name}</td>
                <td><strong>Rs. ${o.total_amount}</strong></td>
                <td><span class="status-badge status-${o.status}">${o.status}</span></td>
                <td>${o.created_at ? o.created_at.split('T')[0] : 'N/A'}</td>
                <td>
                    ${o.status === 'pending' ?
                        `<button class="btn-invoice" onclick="generateInvoice(${o.id})">🧾 Generate Invoice</button>` :
                        '<span style="color:#2ed573;font-weight:600;">✅ Invoiced</span>'}
                </td>
            </tr>
        `).join('');
    }

    async function generateInvoice(id) {
        if (!confirm('Generate invoice for this purchase order?')) return;
        const res = await fetch(`/api/orders/${id}/invoice`, { method: 'POST' });
        const data = await res.json();
        if (data.success) {
            alert(`✅ Invoice generated!\nInvoice Number: ${data.invoice_number}\n\nGo to Invoices to download PDF!`);
            loadOrders();
        }
    }

    loadOrders();
</script>
</body>
</html>
