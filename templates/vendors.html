<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VendorBridge - Vendors</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }
        .sidebar {
            position: fixed; left: 0; top: 0;
            width: 240px; height: 100vh;
            background: linear-gradient(180deg, #667eea, #764ba2);
            color: white; padding: 20px 0; z-index: 100;
        }
        .sidebar-logo { padding: 0 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.2); margin-bottom: 20px; }
        .sidebar-logo h2 { font-size: 20px; font-weight: 800; }
        .sidebar-logo p { font-size: 11px; opacity: 0.7; }
        .nav-item {
            display: flex; align-items: center; gap: 12px;
            padding: 13px 20px; cursor: pointer;
            transition: background 0.3s; font-size: 14px;
            font-weight: 500; text-decoration: none; color: white;
        }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.2); }
        .nav-item span { font-size: 18px; }
        .main { margin-left: 240px; padding: 30px; min-height: 100vh; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .topbar h1 { font-size: 24px; color: #333; font-weight: 700; }
        .btn {
            padding: 10px 20px; background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; border: none; border-radius: 8px;
            font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .btn:hover { opacity: 0.9; }
        .btn-danger {
            padding: 6px 14px; background: #ff4757;
            color: white; border: none; border-radius: 6px;
            font-size: 12px; cursor: pointer;
        }

        /* MODAL */
        .modal-overlay {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 200;
            align-items: center; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white; border-radius: 16px;
            padding: 30px; width: 480px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .modal h2 { margin-bottom: 20px; color: #333; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #444; font-size: 14px; }
        input, select {
            width: 100%; padding: 10px 14px;
            border: 2px solid #e0e0e0; border-radius: 8px;
            font-size: 14px; outline: none;
        }
        input:focus, select:focus { border-color: #667eea; }
        .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
        .btn-cancel {
            padding: 10px 20px; background: #f0f0f0;
            color: #333; border: none; border-radius: 8px;
            font-size: 14px; cursor: pointer;
        }

        /* TABLE */
        .table-container {
            background: white; border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08); overflow: hidden;
        }
        .table-header {
            padding: 20px; display: flex;
            justify-content: space-between; align-items: center;
            border-bottom: 1px solid #f0f0f0;
        }
        .table-header h3 { font-size: 16px; color: #333; }
        .search-input {
            padding: 8px 14px; border: 2px solid #e0e0e0;
            border-radius: 8px; font-size: 14px; outline: none; width: 220px;
        }
        table { width: 100%; border-collapse: collapse; }
        th {
            background: #f8f9fa; padding: 12px 16px;
            text-align: left; font-size: 13px;
            color: #666; font-weight: 600;
        }
        td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid #f5f5f5; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #fafafa; }
        .status-badge {
            padding: 4px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 600;
        }
        .status-active { background: #e8fdf0; color: #2ed573; }
        .status-inactive { background: #ffe8e8; color: #ff4757; }
        .empty-state { text-align: center; padding: 50px; color: #888; }
        .empty-state p { font-size: 16px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-logo">
        <h2>🏢 VendorBridge</h2>
        <p>Procurement ERP</p>
    </div>
    <a href="/dashboard" class="nav-item"><span>📊</span> Dashboard</a>
    <a href="/vendors" class="nav-item active"><span>🏭</span> Vendors</a>
    <a href="/rfq" class="nav-item"><span>📋</span> RFQs</a>
    <a href="/quotations" class="nav-item"><span>💬</span> Quotations</a>
    <a href="/orders" class="nav-item"><span>📦</span> Purchase Orders</a>
    <a href="/invoices" class="nav-item"><span>🧾</span> Invoices</a>
    <a href="/logs" class="nav-item"><span>📜</span> Activity Logs</a>
<a href="/reports" class="nav-item"><span>📈</span> Reports</a>
</div>

<div class="main">
    <div class="topbar">
        <h1>🏭 Vendor Management</h1>
        <button class="btn" onclick="openModal()">+ Add Vendor</button>
    </div>

    <div class="table-container">
        <div class="table-header">
            <h3>All Vendors</h3>
            <input class="search-input" type="text" placeholder="🔍 Search vendors..." oninput="filterVendors(this.value)"/>
        </div>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Vendor Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Category</th>
                    <th>GST</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="vendorTable">
                <tr><td colspan="8" class="empty-state"><p>Loading vendors...</p></td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- ADD VENDOR MODAL -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h2>➕ Add New Vendor</h2>
        <div class="form-group">
            <label>Vendor Name</label>
            <input type="text" id="vName" placeholder="Enter vendor name"/>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="vEmail" placeholder="Enter email"/>
        </div>
        <div class="form-group">
            <label>Phone</label>
            <input type="text" id="vPhone" placeholder="Enter phone number"/>
        </div>
        <div class="form-group">
            <label>Category</label>
            <select id="vCategory">
                <option value="IT">IT & Technology</option>
                <option value="Office">Office Supplies</option>
                <option value="Logistics">Logistics</option>
                <option value="Manufacturing">Manufacturing</option>
                <option value="Services">Services</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div class="form-group">
            <label>GST Number</label>
            <input type="text" id="vGst" placeholder="Enter GST number"/>
        </div>
        <div class="modal-btns">
            <button class="btn" onclick="addVendor()">Save Vendor</button>
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        </div>
    </div>
</div>

<script>
    let allVendors = [];

    function openModal() { document.getElementById('modalOverlay').classList.add('active'); }
    function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }

    async function loadVendors() {
        const res = await fetch('/api/vendors');
        allVendors = await res.json();
        renderVendors(allVendors);
    }

    function renderVendors(vendors) {
        const tbody = document.getElementById('vendorTable');
        if (vendors.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="empty-state">🏭<p>No vendors yet. Add your first vendor!</p></td></tr>';
            return;
        }
        tbody.innerHTML = vendors.map((v, i) => `
            <tr>
                <td>${i + 1}</td>
                <td><strong>${v.name}</strong></td>
                <td>${v.email}</td>
                <td>${v.phone || '-'}</td>
                <td>${v.category || '-'}</td>
                <td>${v.gst || '-'}</td>
                <td><span class="status-badge status-${v.status}">${v.status}</span></td>
                <td><button class="btn-danger" onclick="deleteVendor(${v.id})">Delete</button></td>
            </tr>
        `).join('');
    }

    function filterVendors(query) {
        const filtered = allVendors.filter(v =>
            v.name.toLowerCase().includes(query.toLowerCase()) ||
            v.email.toLowerCase().includes(query.toLowerCase()) ||
            (v.category && v.category.toLowerCase().includes(query.toLowerCase()))
        );
        renderVendors(filtered);
    }

    async function addVendor() {
        const name = document.getElementById('vName').value;
        const email = document.getElementById('vEmail').value;
        const phone = document.getElementById('vPhone').value;
        const category = document.getElementById('vCategory').value;
        const gst = document.getElementById('vGst').value;
        if (!name || !email) { alert('Name and Email are required!'); return; }
        const res = await fetch('/api/vendors', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, phone, category, gst })
        });
        const data = await res.json();
        if (data.success) {
            closeModal();
            loadVendors();
            document.getElementById('vName').value = '';
            document.getElementById('vEmail').value = '';
            document.getElementById('vPhone').value = '';
            document.getElementById('vGst').value = '';
        }
    }

    async function deleteVendor(id) {
        if (!confirm('Are you sure you want to delete this vendor?')) return;
        await fetch(`/api/vendors/${id}`, { method: 'DELETE' });
        loadVendors();
    }

    loadVendors();
</script>
</body>
</html>
