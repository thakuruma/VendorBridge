<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VendorBridge - Forgot Password</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 { color: #667eea; font-size: 28px; font-weight: 800; }
        .logo p { color: #888; font-size: 13px; margin-top: 4px; }
        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #444;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus { border-color: #667eea; }
        .btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .btn:hover { opacity: 0.9; }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .back-link:hover { text-decoration: underline; }
        .success {
            color: green;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
        }
        .error {
            color: red;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
        }
        .steps {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
        }
        .step {
            width: 30px; height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            background: #e0e0e0;
            color: #888;
        }
        .step.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .step-line {
            width: 40px; height: 2px;
            background: #e0e0e0;
            margin-top: 14px;
        }
        .form-section { display: none; }
        .form-section.active { display: block; }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <h1>🔐 Reset Password</h1>
        <p>VendorBridge Procurement ERP</p>
    </div>

    <div class="steps">
        <div class="step active" id="step1">1</div>
        <div class="step-line"></div>
        <div class="step" id="step2">2</div>
    </div>

   
    <div class="form-section active" id="emailSection">
        <div class="form-group">
            <label>Enter your registered Email</label>
            <input type="email" id="resetEmail" placeholder="Enter your email"/>
        </div>
        <button class="btn" onclick="verifyEmail()">Verify Email</button>
        <div id="emailMsg"></div>
    </div>

    
    <div class="form-section" id="passwordSection">
        <div class="form-group">
            <label>New Password</label>
            <input type="password" id="newPassword" placeholder="Enter new password"/>
        </div>
        <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm new password"/>
        </div>
        <button class="btn" onclick="resetPassword()">Reset Password</button>
        <div id="passwordMsg"></div>
    </div>

    <a href="/login" class="back-link">← Back to Login</a>
</div>

<script>
    async function verifyEmail() {
        const email = document.getElementById('resetEmail').value;
        if (!email) {
            document.getElementById('emailMsg').innerHTML = '<p class="error">Please enter your email!</p>';
            return;
        }
        const res = await fetch('/api/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, check_only: true })
        });
        const data = await res.json();
        if (data.success || data.message !== 'Email not found!') {
            document.getElementById('emailSection').classList.remove('active');
            document.getElementById('passwordSection').classList.add('active');
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
        } else {
            document.getElementById('emailMsg').innerHTML = `<p class="error">${data.message}</p>`;
        }
    }

    async function resetPassword() {
        const email = document.getElementById('resetEmail').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        if (!newPassword || !confirmPassword) {
            document.getElementById('passwordMsg').innerHTML = '<p class="error">Please fill all fields!</p>';
            return;
        }
        if (newPassword !== confirmPassword) {
            document.getElementById('passwordMsg').innerHTML = '<p class="error">Passwords do not match!</p>';
            return;
        }
        const res = await fetch('/api/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, new_password: newPassword })
        });
        const data = await res.json();
        if (data.success) {
            document.getElementById('passwordMsg').innerHTML = '<p class="success">✅ Password reset successfully! Redirecting to login...</p>';
            setTimeout(() => window.location.href = '/login', 2000);
        } else {
            document.getElementById('passwordMsg').innerHTML = `<p class="error">${data.message}</p>`;
        }
    }
</script>
</body>
</html>
