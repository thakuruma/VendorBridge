<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VendorBridge - RFQs</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }
        .sidebar {
            position: fixed; left: 0; top: 0;
            width: 240px; height: 100vh;
            background: linear-gradient(180deg, #667eea, #764ba2);
            color: white; padding: 20px 0; z-index: 100;
        }
        .sidebar-logo { padding: 0 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.2); margin-bottom: 20px; }
        .sidebar-logo h2 { font-size: 20px; font-weight: 800; }
        .sidebar-logo p { font-size: 11px; opacity: 0.7; }
        .nav-item {
            display: flex; align-items: center; gap: 12px;
            padding: 13px 20px; cursor: pointer;
            transition: background 0.3s; font-size: 14px;
            font-weight: 500; text-decoration: none; color: white;
        }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.2); }
        .nav-item span { font-size: 18px; }
        .main { margin-left: 240px; padding: 30px; min-height: 100vh; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .topbar h1 { font-size: 24px; color: #333; font-weight: 700; }
        .btn {
            padding: 10px 20px; background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; border: none; border-radius: 8px;
            font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .btn:hover { opacity: 0.9; }
        .modal-overlay {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 200;
            align-items: center; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white; border-radius: 16px;
            padding: 30px; width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-height: 90vh; overflow-y: auto;
        }
        .modal h2 { margin-bottom: 20px; color: #333; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #444; font-size: 14px; }
        input, select, textarea {
            width: 100%; padding: 10px 14px;
            border: 2px solid #e0e0e0; border-radius: 8px;
            font-size: 14px; outline: none; font-family: inherit;
        }
        input:focus, select:focus, textarea:focus { border-color: #667eea; }
        textarea { resize: vertical; min-height: 80px; }
        .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
        .btn-cancel {
            padding: 10px 20px; background: #f0f0f0;
            color: #333; border: none; border-radius: 8px;
            font-size: 14px; cursor: pointer;
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .rfq-card {
            background: white; border-radius: 12px;
            padding: 24px; box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            transition: transform 0.2s;
        }
        .rfq-card:hover { transform: translateY(-3px); }
        .rfq-card-header {
            display: flex; justify-content: space-between;
            align-items: flex-start; margin-bottom: 16px;
        }
        .rfq-title { font-size: 16px; font-weight: 700; color: #333; }
        .status-badge {
            padding: 4px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 600;
        }
        .status-open { background: #e8fdf0; color: #2ed573; }
        .status-closed { background: #ffe8e8; color: #ff4757; }
        .rfq-detail { font-size: 13px; color: #666; margin-bottom: 8px; }
        .rfq-detail strong { color: #333; }
        .empty-state { text-align: center; padding: 80px; color: #888; grid-column: 1/-1; }
        .empty-state .icon { font-size: 50px; margin-bottom: 12px; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-logo">
        <h2>🏢 VendorBridge</h2>
        <p>Procurement ERP</p>
    </div>
    <a href="/dashboard" class="nav-item"><span>📊</span> Dashboard</a>
    <a href="/vendors" class="nav-item"><span>🏭</span> Vendors</a>
    <a href="/rfq" class="nav-item active"><span>📋</span> RFQs</a>
    <a href="/quotations" class="nav-item"><span>💬</span> Quotations</a>
    <a href="/orders" class="nav-item"><span>📦</span> Purchase Orders</a>
    <a href="/invoices" class="nav-item"><span>🧾</span> Invoices</a>
    <a href="/logs" class="nav-item"><span>📜</span> Activity Logs</a>
    <a href="/reports" class="nav-item"><span>📈</span> Reports</a>
</div>

<div class="main">
    <div class="topbar">
        <h1>📋 Request for Quotations</h1>
        <button class="btn" onclick="openModal()">+ Create RFQ</button>
    </div>

    <div class="cards-grid" id="rfqGrid">
        <div class="empty-state">
            <div class="icon">📋</div>
            <p>Loading RFQs...</p>
        </div>
    </div>
</div>

<!-- CREATE RFQ MODAL -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h2>📋 Create New RFQ</h2>
        <div class="form-group">
            <label>RFQ Title</label>
            <input type="text" id="rfqTitle" placeholder="e.g. Office Chairs Purchase"/>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea id="rfqDesc" placeholder="Describe what you need..."></textarea>
        </div>
        <div class="form-group">
            <label>Quantity</label>
            <input type="number" id="rfqQty" placeholder="Enter quantity" min="1"/>
        </div>
        <div class="form-group">
            <label>Deadline</label>
            <input type="date" id="rfqDeadline"/>
        </div>
        <div class="form-group">
            <label>Assign Vendor</label>
            <select id="rfqVendor">
                <option value="">Select a vendor...</option>
            </select>
        </div>
        <div class="modal-btns">
            <button class="btn" onclick="createRFQ()">Create RFQ</button>
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        </div>
    </div>
</div>

<script>
    function openModal() {
        loadVendorsDropdown();
        document.getElementById('modalOverlay').classList.add('active');
    }
    function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }

    async function loadVendorsDropdown() {
        const res = await fetch('/api/vendors');
        const vendors = await res.json();
        const select = document.getElementById('rfqVendor');
        select.innerHTML = '<option value="">Select a vendor...</option>';
        vendors.forEach(v => {
            select.innerHTML += `<option value="${v.id}">${v.name}</option>`;
        });
    }

    async function loadRFQs() {
        const res = await fetch('/api/rfqs');
        const rfqs = await res.json();
        const grid = document.getElementById('rfqGrid');
        if (rfqs.length === 0) {
            grid.innerHTML = `
                <div class="empty-state">
                    <div class="icon">📋</div>
                    <p>No RFQs yet. Create your first RFQ!</p>
                </div>`;
            return;
        }
        grid.innerHTML = rfqs.map(r => `
            <div class="rfq-card">
                <div class="rfq-card-header">
                    <div class="rfq-title">${r.title}</div>
                    <span class="status-badge status-${r.status}">${r.status}</span>
                </div>
                <div class="rfq-detail"><strong>Description:</strong> ${r.description || 'N/A'}</div>
                <div class="rfq-detail"><strong>Quantity:</strong> ${r.quantity || 'N/A'}</div>
                <div class="rfq-detail"><strong>Deadline:</strong> ${r.deadline || 'N/A'}</div>
                <div class="rfq-detail"><strong>Vendor:</strong> ${r.vendor_name || 'Not assigned'}</div>
                <div class="rfq-detail"><strong>Created:</strong> ${r.created_at ? r.created_at.split('T')[0] : 'N/A'}</div>
            </div>
        `).join('');
    }

    async function createRFQ() {
        const title = document.getElementById('rfqTitle').value;
        const description = document.getElementById('rfqDesc').value;
        const quantity = document.getElementById('rfqQty').value;
        const deadline = document.getElementById('rfqDeadline').value;
        const vendor_id = document.getElementById('rfqVendor').value;
        if (!title || !quantity || !deadline) {
            alert('Please fill Title, Quantity and Deadline!');
            return;
        }
        const res = await fetch('/api/rfqs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, description, quantity, deadline, vendor_id })
        });
        const data = await res.json();
        if (data.success) {
            closeModal();
            loadRFQs();
            document.getElementById('rfqTitle').value = '';
            document.getElementById('rfqDesc').value = '';
            document.getElementById('rfqQty').value = '';
            document.getElementById('rfqDeadline').value = '';
        }
    }

    loadRFQs();
</script>
</body>
</html>
