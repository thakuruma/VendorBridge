<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VendorBridge - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            color: #667eea;
            font-size: 28px;
            font-weight: 800;
        }
        .logo p { color: #888; font-size: 13px; }
        .tabs {
            display: flex;
            margin-bottom: 25px;
            background: #f5f5f5;
            border-radius: 8px;
            padding: 4px;
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border-radius: 6px;
            font-weight: 600;
            color: #888;
            transition: all 0.3s;
        }
        .tab.active {
            background: white;
            color: #667eea;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #444;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            outline: none;
        }
        input:focus, select:focus { border-color: #667eea; }
        .btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .btn:hover { opacity: 0.9; }
        .error {
            color: red;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
        }
        .success {
            color: green;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
        }
        .form-section { display: none; }
        .form-section.active { display: block; }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <h1>🏢 VendorBridge</h1>
        <p>Procurement & Vendor Management ERP</p>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('login')">Login</div>
        <div class="tab" onclick="switchTab('signup')">Sign Up</div>
    </div>

    
    <div class="form-section active" id="loginForm">
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="Enter your email"/>
        </div>
        <div class="form-group">
            <label>Password</label>
            <div style="position:relative;">
    <input type="password" id="loginPassword" placeholder="Enter your password" style="padding-right:40px;"/>
    <span onclick="togglePassword('loginPassword', this)" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:18px;">👁️</span>
</div>
        </div>
        <button class="btn" onclick="login()">Login</button>
        <div style="text-align:center; margin-top:12px;">
    <a href="/forgot-password" style="color:#667eea; font-size:13px; font-weight:600;">Forgot Password?</a>
    </div>
        <div id="loginMsg"></div>
    </div>

    
    <div class="form-section" id="signupForm">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="signupName" placeholder="Enter your name"/>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="signupEmail" placeholder="Enter your email"/>
        </div>
        <div class="form-group">
            <label>Password</label>
            <div style="position:relative;">
    <input type="password" id="signupPassword" placeholder="Create a password" style="padding-right:40px;"/>
    <span onclick="togglePassword('signupPassword', this)" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:18px;">👁️</span>
</div>
        </div>
        <div class="form-group">
            <label>Role</label>
            <select id="signupRole">
                <option value="officer">Procurement Officer</option>
                <option value="vendor">Vendor</option>
                <option value="manager">Manager</option>
                <option value="admin">Admin</option>
            </select>
        </div>
        <button class="btn" onclick="signup()">Create Account</button>
        <div id="signupMsg"></div>
    </div>
</div>

<script>
    function togglePassword(inputId, icon) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = '🙈';
    } else {
        input.type = 'password';
        icon.textContent = '👁️';
    }
}
    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
        if (tab === 'login') {
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.getElementById('loginForm').classList.add('active');
        } else {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('signupForm').classList.add('active');
        }
    }

    async function login() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        if (!email || !password) {
            document.getElementById('loginMsg').innerHTML = '<p class="error">Please fill all fields</p>';
            return;
        }
        const res = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.success) {
            window.location.href = '/dashboard';
        } else {
            document.getElementById('loginMsg').innerHTML = `<p class="error">${data.message}</p>`;
        }
    }

    async function signup() {
        const name = document.getElementById('signupName').value;
        const email = document.getElementById('signupEmail').value;
        const password = document.getElementById('signupPassword').value;
        const role = document.getElementById('signupRole').value;
        if (!name || !email || !password) {
            document.getElementById('signupMsg').innerHTML = '<p class="error">Please fill all fields</p>';
            return;
        }
        const res = await fetch('/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password, role })
        });
        const data = await res.json();
        if (data.success) {
            document.getElementById('signupMsg').innerHTML = '<p class="success">Account created! Please login.</p>';
            setTimeout(() => switchTab('login'), 1500);
        } else {
            document.getElementById('signupMsg').innerHTML = `<p class="error">${data.message}</p>`;
        }
    }
</script>
</body>
</html>
